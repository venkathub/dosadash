[project]
name = "dosadash-shared"
version = "0.1.0"
description = "Shared Pydantic schemas for DosaDash services"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dosadash_shared"]
