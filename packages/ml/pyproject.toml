[project]
name = "dosadash-ml"
version = "0.1.0"
description = "DosaDash ML: synthetic data generation, forecasting, recsys, fine-tuning"
requires-python = ">=3.12"
dependencies = [
    "dosadash-shared",
]

# Heavy ML deps are opt-in extras so the api/bot images (which depend on
# dosadash-ml for datagen only) never pull them (4 GB RAM budget, Hard Rule 7):
# - forecast: what the Celery worker needs to *score* (features + inference)
# - infer:    checkout-time ETA scoring inside the ai service (xgboost only)
# - train:    local/CI-only training + registry (MLflow never runs on the VPS)
[project.optional-dependencies]
infer = [
    "xgboost>=2.1",
]
# INT8 ONNX sentiment champion serving (Phase 8): onnxruntime + the Rust
# tokenizers lib only — torch/transformers/peft stay in the root `finetune`
# dependency group and NEVER reach the VPS images (Hard Rule 7 economics).
sentiment = [
    "onnxruntime>=1.19",
    "tokenizers>=0.20",
    "numpy>=1.26",
]
forecast = [
    "dosadash-ml[infer]",
    "pandas>=2.2",
]
train = [
    "mlflow>=2.16",
    "scikit-learn>=1.5",
    "implicit>=0.7",
    "scipy>=1.14",
]

[tool.uv.sources]
dosadash-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dosadash_ml"]
