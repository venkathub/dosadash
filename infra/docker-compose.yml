name: dosadash

# Memory budget (4 GB VPS, docs/02): postgres ~512M, redis ~128M,
# api ~384M, ai ~768M (Phase 8: +INT8 DistilBERT sentiment champion,
# ~150 MB loaded), web ~256M, caddy ~64M, bot ~128M,
# worker ~320M + redis-celery ~48M (Phase 5) — total limits ≈ 2.6 GB.

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dosadash}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-dosadash}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dosadash}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "96mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M

  # Celery broker/result store. Separate instance on purpose: the cache redis
  # above runs allkeys-lru, which can evict queued task messages — the broker
  # needs noeviction (docs/02 §2.4). No persistence: queues are transient and
  # every nightly job is idempotent (upserts), so a restart just skips a beat.
  redis-celery:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      ["redis-server", "--maxmemory", "32mb", "--maxmemory-policy", "noeviction", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 48M

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      API_ENV: ${ENV:-prod}
      API_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dosadash}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dosadash}
      API_REDIS_URL: redis://redis:6379/0
      API_JWT_SECRET: ${JWT_SECRET:?set in .env}
      API_RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      API_RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      API_RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      API_TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      API_INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
      # Mock-aggregator webhook HMAC secret (Phase 7, docs/04 O12)
      API_AGGREGATOR_WEBHOOK_SECRET: ${AGGREGATOR_WEBHOOK_SECRET:-}
      API_AI_BASE_URL: http://ai:8001
      # Read-only copilot role — created by migration b3f9c82d4e61 when set
      READONLY_DB_PASSWORD: ${READONLY_DB_PASSWORD:-}
      # AI dish photos (Phase 7) — named volume so approved images survive deploys
      API_MEDIA_DIR: /app/media
    volumes:
      - apimedia:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 384M

  # Celery worker + beat (Phase 5): nightly forecast/CRM scoring (docs/02
  # §2.4). Same codebase/image as api, built with the `worker` extra
  # (celery + pandas + xgboost); api container never imports celery.
  worker:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      args:
        UV_EXTRA_ARGS: "--extra worker"
    restart: unless-stopped
    command:
      [
        "celery",
        "--app=dosadash_api.worker.celery_app:app",
        "worker",
        "--beat",
        "--schedule=/tmp/celerybeat-schedule",
        "--loglevel=INFO",
        "--concurrency=1",
      ]
    environment:
      API_ENV: ${ENV:-prod}
      API_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dosadash}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dosadash}
      # Cache/event-bus redis (Hard Rule 4 cascade publishing from tasks)
      API_REDIS_URL: redis://redis:6379/0
      API_CELERY_BROKER_URL: redis://redis-celery:6379/0
      API_CELERY_RESULT_BACKEND: redis://redis-celery:6379/1
      API_MODEL_DIR: /app/models
      # Phase 6: the nightly inventory agent calls ai (draft POs) and bot
      # (owner approval cards) — same shared secret as the api service.
      API_INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
      API_AI_BASE_URL: http://ai:8001
      API_BOT_BASE_URL: http://bot:8081
    depends_on:
      postgres:
        condition: service_healthy
      redis-celery:
        condition: service_healthy
    healthcheck:
      # Image healthcheck probes uvicorn :8000 — meaningless for the worker.
      disable: true
    deploy:
      resources:
        limits:
          memory: 320M

  ai:
    build:
      context: ..
      dockerfile: apps/ai/Dockerfile
    restart: unless-stopped
    environment:
      AI_ENV: ${ENV:-prod}
      AI_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dosadash}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dosadash}
      # Same logical DB as the api: Redis pub/sub is per-DB, and the ai
      # service subscribes to the api's event cascade (Hard Rule 4).
      AI_REDIS_URL: redis://redis:6379/0
      AI_KNOWLEDGE_DIR: /app/knowledge
      AI_MODEL_DIR: /app/models
      AI_INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
      # Copilot runs as the read-only role when set (else main role +
      # READ ONLY transaction + SQL guardrail still apply)
      AI_READONLY_DB_PASSWORD: ${READONLY_DB_PASSWORD:-}
      # LLM provider keys — read directly by litellm (Hard Rule 1)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Langfuse Cloud tracing (Hard Rule 6) — enabled when keys are set
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 768M

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  bot:
    build:
      context: ..
      dockerfile: apps/bot/Dockerfile
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?set in .env}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://dosadash.venkateshs.dev}
      API_BASE_URL: http://api:8000
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
    deploy:
      resources:
        limits:
          memory: 128M

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      # AIC Cloud reserves 80/443; its front proxy forwards the domain to this
      # high port. TLS terminates at the AIC proxy, Caddy routes plain HTTP.
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - api
      - ai
      - web
      - bot
    deploy:
      resources:
        limits:
          memory: 64M

volumes:
  pgdata:
  redisdata:
  caddydata:
  caddyconfig:
  apimedia:
