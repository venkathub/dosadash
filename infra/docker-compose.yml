name: dosadash

# Memory budget (4 GB VPS, docs/02): postgres ~512M, redis ~128M,
# api ~384M, ai ~512M, web ~256M, caddy ~64M — headroom for bot/celery later.

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dosadash}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-dosadash}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dosadash}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "96mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      API_ENV: ${ENV:-prod}
      API_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dosadash}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dosadash}
      API_REDIS_URL: redis://redis:6379/0
      API_JWT_SECRET: ${JWT_SECRET:?set in .env}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 384M

  ai:
    build:
      context: ..
      dockerfile: apps/ai/Dockerfile
    restart: unless-stopped
    environment:
      AI_ENV: ${ENV:-prod}
      AI_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dosadash}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dosadash}
      AI_REDIS_URL: redis://redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  bot:
    build:
      context: ..
      dockerfile: apps/bot/Dockerfile
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?set in .env}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://dosadash.venkateshs.dev}
    deploy:
      resources:
        limits:
          memory: 128M

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      # AIC Cloud reserves 80/443; its front proxy forwards the domain to this
      # high port. TLS terminates at the AIC proxy, Caddy routes plain HTTP.
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - api
      - ai
      - web
      - bot
    deploy:
      resources:
        limits:
          memory: 64M

volumes:
  pgdata:
  redisdata:
  caddydata:
  caddyconfig:
