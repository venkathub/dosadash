[project]
name = "dosadash-ai"
version = "0.1.0"
description = "DosaDash AI service: agents, RAG, guardrails, MCP server, ML inference"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "dosadash-shared",
]

[tool.uv.sources]
dosadash-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dosadash_ai"]
