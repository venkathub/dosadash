[project]
name = "dosadash-ai"
version = "0.1.0"
description = "DosaDash AI service: agents, RAG, guardrails, MCP server, ML inference"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "litellm>=1.55",
    "langfuse>=2.55,<3",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "pgvector>=0.3",
    "redis>=5.2",
    "langgraph>=0.2",
    "dosadash-shared",
    "dosadash-ml[infer]",
    "mcp>=2.0.0",
]

[project.scripts]
dosadash-mcp = "dosadash_ai.mcp_server:main"

[tool.uv.sources]
dosadash-shared = { workspace = true }
dosadash-ml = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dosadash_ai"]
