[project]
name = "dosadash-api"
version = "0.1.0"
description = "DosaDash core API: auth, menu, orders, payments, admin"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    "pyjwt>=2.10",
    "redis>=5.2",
    "dosadash-shared",
    "dosadash-ml",
]

[tool.uv.sources]
dosadash-shared = { workspace = true }
dosadash-ml = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dosadash_api"]
