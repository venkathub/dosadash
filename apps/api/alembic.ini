[alembic]
script_location = migrations
prepend_sys_path = .
# URL is taken from API_DATABASE_URL env var (see migrations/env.py);
# this value is only a local-dev fallback.
sqlalchemy.url = postgresql+asyncpg://dosadash:dosadash@localhost:5432/dosadash

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
