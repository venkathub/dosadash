[project]
name = "dosadash-bot"
version = "0.1.0"
description = "DosaDash Telegram adapter (aiogram, webhook mode) — thin, no business logic"
requires-python = ">=3.12"
dependencies = [
    "dosadash-shared",
]

[tool.uv.sources]
dosadash-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dosadash_bot"]
