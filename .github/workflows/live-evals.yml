# Live eval merge gate (Hard Rule 5). Runs the full agent (real LLM chain +
# real DB) over all 80 golden conversations and fails the check if
# order_accuracy < 0.95, tool_correctness < 1.0, or any guardrail bypass
# occurs. Runs on every PR so the check can be a REQUIRED status check
# (Phase 13: the fixer's auto-merge waits on required checks — a
# path-filtered workflow would never report on unrelated PRs and starve
# them forever). The expensive job itself still only runs when agents,
# prompts, shared schemas, or evals changed: the `changes` job diffs the
# PR and unrelated PRs skip the gate, which GitHub counts as success.

name: Live evals

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: live-evals-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
  LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
  LANGFUSE_HOST: ${{ secrets.LANGFUSE_HOST }}
  API_DATABASE_URL: postgresql+asyncpg://dosadash:dosadash@localhost:5433/dosadash
  AI_DATABASE_URL: postgresql+asyncpg://dosadash:dosadash@localhost:5433/dosadash

jobs:
  changes:
    name: Detect eval-relevant changes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      relevant: ${{ steps.diff.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
              | grep -E '^(apps/ai/|packages/shared/|evals/|\.github/workflows/live-evals\.yml)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "No agent/prompt/shared/eval changes — live gate skipped (counts as pass)."
          fi

  live-evals:
    name: Live eval gate (order_accuracy >= 0.95)
    needs: changes
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' || needs.changes.outputs.relevant == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: dosadash
          POSTGRES_PASSWORD: dosadash
          POSTGRES_DB: dosadash
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U dosadash"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Require LLM keys
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY secret is not configured — the live eval gate cannot run (Hard Rule 5: evals are merge gates)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync workspace
        run: uv sync --all-packages --group dev

      - name: Migrate database
        working-directory: apps/api
        run: uv run alembic upgrade head

      - name: Seed menu + settings
        run: uv run python -m dosadash_api.seed

      - name: Ingest knowledge base (RAG)
        run: uv run python -m dosadash_ai.rag.ingest --knowledge-dir knowledge

      - name: Run live eval suites (one pass, all metrics)
        run: uv run python evals/suites/run_live_evals.py --json live_eval_results.json

      # Scoreboard ingest (Phase 4): POST the results to the production API —
      # pass or fail, regressions belong on the scoreboard too. Non-fatal:
      # the gate verdict above stays authoritative even if prod is down.
      - name: Post results to eval scoreboard
        if: always()
        continue-on-error: true
        env:
          EVAL_INGEST_URL: ${{ secrets.EVAL_INGEST_URL }}
          INTERNAL_API_TOKEN: ${{ secrets.INTERNAL_API_TOKEN }}
        run: |
          if [ ! -f live_eval_results.json ]; then
            echo "no results file — nothing to ingest"; exit 0
          fi
          if [ -z "$EVAL_INGEST_URL" ] || [ -z "$INTERNAL_API_TOKEN" ]; then
            echo "::notice::EVAL_INGEST_URL / INTERNAL_API_TOKEN not configured — skipping scoreboard ingest"
            exit 0
          fi
          jq --arg sha "$GITHUB_SHA" '. + {git_sha: $sha, trigger: "ci"}' \
            live_eval_results.json > ingest_payload.json
          curl --fail-with-body -sS -X POST "$EVAL_INGEST_URL" \
            -H "Content-Type: application/json" \
            -H "X-Internal-Token: $INTERNAL_API_TOKEN" \
            --data @ingest_payload.json
          echo "run recorded on the eval scoreboard"

      - name: Upload results JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-eval-results
          path: live_eval_results.json
          if-no-files-found: ignore
