name: Live evals

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "30 20 * * *" # 02:00 IST, full profile

concurrency:
  group: live-evals-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
  LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
  LANGFUSE_HOST: ${{ secrets.LANGFUSE_HOST }}
  EVAL_DATABASE_URL: postgresql+asyncpg://dosadash:dosadash@localhost:5433/dosadash_eval
  AI_SEMCACHE_ENABLED: "false"
  API_DATABASE_URL: postgresql+asyncpg://dosadash:dosadash@localhost:5433/dosadash_eval
  AI_DATABASE_URL: postgresql+asyncpg://dosadash:dosadash@localhost:5433/dosadash_eval

jobs:
  changes:
    name: Detect eval-relevant changes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      relevant: ${{ steps.diff.outputs.relevant }}
      suites: ${{ steps.diff.outputs.suites }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" > changed_paths.txt
          python3 evals/select_suites.py changed_paths.txt >> "$GITHUB_OUTPUT"


  live-evals:
    name: Live eval gate (order_accuracy >= 0.95)
    needs: changes
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: dosadash
          POSTGRES_PASSWORD: dosadash
          POSTGRES_DB: dosadash_eval
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U dosadash"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Require successful change detection
        if: github.event_name == 'pull_request' && needs.changes.result != 'success'
        run: |
          echo "::error::Change detection failed; required live gate cannot pass."
          exit 1

      - name: No relevant changes
        if: github.event_name == 'pull_request' && needs.changes.outputs.relevant == 'false'
        run: echo "Live suites not applicable; no AI dependencies changed."

      - name: Require LLM keys
        if: github.event_name != 'pull_request' || needs.changes.outputs.relevant == 'true'
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY secret is not configured — the live eval gate cannot run (Hard Rule 5: evals are merge gates)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Install uv
        if: github.event_name != 'pull_request' || needs.changes.outputs.relevant == 'true'
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync workspace
        if: github.event_name != 'pull_request' || needs.changes.outputs.relevant == 'true'
        run: uv sync --all-packages --group dev

      - name: Migrate database
        if: github.event_name != 'pull_request' || needs.changes.outputs.relevant == 'true'
        working-directory: apps/api
        run: uv run alembic upgrade head

      - name: Seed menu + settings
        if: github.event_name != 'pull_request' || needs.changes.outputs.relevant == 'true'
        run: uv run python -m dosadash_api.seed --end-date 2026-08-20 --users 40

      - name: Ingest knowledge base (RAG)
        if: github.event_name != 'pull_request' || needs.changes.outputs.relevant == 'true'
        run: uv run python -m dosadash_ai.rag.ingest --knowledge-dir knowledge

      - name: Run live eval suites (one pass, all metrics)
        if: github.event_name != 'pull_request' || needs.changes.outputs.relevant == 'true'
        env:
          EVAL_PROFILE: ${{ github.event_name == 'pull_request' && 'pr' || 'full' }}
          EVAL_SUITES: ${{ github.event_name == 'pull_request' && needs.changes.outputs.suites || 'retrieval,rag,support,inventory,copilot' }}
        run: uv run python evals/suites/run_live_evals.py --profile "$EVAL_PROFILE" --suites "$EVAL_SUITES" --json live_eval_results.json

      # Scoreboard ingest (Phase 4): POST the results to the production API —
      # pass or fail, regressions belong on the scoreboard too. Non-fatal:
      # the gate verdict above stays authoritative even if prod is down.
      - name: Post results to eval scoreboard
        if: always()
        continue-on-error: true
        env:
          EVAL_INGEST_URL: ${{ secrets.EVAL_INGEST_URL }}
          INTERNAL_API_TOKEN: ${{ secrets.INTERNAL_API_TOKEN }}
        run: |
          if [ ! -f live_eval_results.json ]; then
            echo "no results file — nothing to ingest"; exit 0
          fi
          if [ -z "$EVAL_INGEST_URL" ] || [ -z "$INTERNAL_API_TOKEN" ]; then
            echo "::notice::EVAL_INGEST_URL / INTERNAL_API_TOKEN not configured — skipping scoreboard ingest"
            exit 0
          fi
          jq --arg sha "$GITHUB_SHA" --arg trigger "${{ github.event_name == 'schedule' && 'scheduled' || 'ci' }}" '. + {git_sha: $sha, trigger: $trigger}' \
            live_eval_results.json > ingest_payload.json
          curl --fail-with-body -sS -X POST "$EVAL_INGEST_URL" \
            -H "Content-Type: application/json" \
            -H "X-Internal-Token: $INTERNAL_API_TOKEN" \
            --data @ingest_payload.json
          echo "run recorded on the eval scoreboard"

      - name: Upload results JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-eval-results
          path: live_eval_results.json
          if-no-files-found: ignore
