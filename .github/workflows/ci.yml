name: CI

on:
  push:
    branches: [main, "phase/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python lint + tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: dosadash
          POSTGRES_PASSWORD: dosadash
          POSTGRES_DB: dosadash
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U dosadash"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync workspace
        run: uv sync --all-packages --group dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Pytest
        run: uv run pytest -q

  web:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

  # Placeholder — becomes a real merge gate in Phase 4 (Hard Rule 5).
  # Will fail the build if order_accuracy < 0.95 once suites exist.
  evals:
    name: Eval suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No eval suites yet (Phase 3+)
        run: echo "Eval suites land in Phase 3/4 and become merge gates."
