name: Deploy

# main = production (docs/08). Merge to main → deploy to the AIC Cloud VPS.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/dosadash
            git fetch origin main
            git reset --hard origin/main
            docker compose -f infra/docker-compose.yml --env-file infra/.env up -d --build --remove-orphans
            # Caddyfile is a SINGLE-FILE bind mount: `git reset --hard` above
            # replaces the host file's inode, but the mount keeps exposing the
            # OLD inode to the container — so `caddy reload` faithfully
            # re-reads STALE config forever (Phase 10 postmortem: /media/*
            # 404'd in prod for days; caddy had been up since before Phase 7
            # while every deploy "reloaded" the pre-Phase-7 file). Compare
            # host vs in-container checksums and restart caddy only on drift
            # (restart re-resolves the bind path to the new inode).
            HOST_SUM=$(sha256sum infra/Caddyfile | cut -d' ' -f1)
            CTR_SUM=$(docker compose -f infra/docker-compose.yml exec -T caddy sha256sum /etc/caddy/Caddyfile | cut -d' ' -f1)
            if [ "$HOST_SUM" != "$CTR_SUM" ]; then
              echo "Caddyfile drift detected (host $HOST_SUM != container $CTR_SUM) — restarting caddy"
              docker compose -f infra/docker-compose.yml restart caddy
            else
              echo "✓ caddy config in sync"
            fi
            docker image prune -f
            # BuildKit cache from --build accumulates in /var/lib/containerd
            # (~26 GB by week 9, 76% disk). Keep 5 GB of recent layers so
            # rebuilds stay fast; everything older goes.
            docker builder prune -f --keep-storage=5GB
            # Post-deploy smoke with retries: a rebuilt api needs longer than
            # a fixed sleep to come up, and a single eager curl once failed a
            # deploy that was actually healthy seconds later (Phase 9). Fail
            # only after ~60s of real downtime — that's a real incident.
            for i in $(seq 1 12); do
              if curl -fsS http://localhost:8080/healthz > /dev/null; then
                echo "✓ healthz OK (attempt $i)"
                exit 0
              fi
              echo "healthz not ready (attempt $i/12), retrying in 5s…"
              sleep 5
            done
            echo "✗ healthz still failing after 60s — deploy is genuinely broken"
            exit 1
